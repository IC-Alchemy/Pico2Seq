<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeCluttered — 3-Day Change Explorer (Sep 10–12, 2026)</title>
<style>
  :root{
    --bg:#111318; --panel:#1a1d24; --panel2:#20242d; --border:#2e333e;
    --text:#dde1e8; --dim:#8b93a2; --accent:#5ab0ff; --green:#6fd08c;
    --amber:#e8b95a; --red:#e57373; --purple:#b48ee8; --cyan:#5ad0c8;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,sans-serif; font-size:14px; height:100vh; display:flex; flex-direction:column; overflow:hidden}
  header{padding:14px 20px; border-bottom:1px solid var(--border); display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
  header h1{font-size:17px; font-weight:650}
  header .sub{color:var(--dim); font-size:12.5px}
  header .stat{margin-left:auto; font-family:ui-monospace,Consolas,monospace; font-size:12px; color:var(--accent)}
  #main{flex:1; display:flex; min-height:0}
  /* Left: controls */
  #controls{width:280px; min-width:230px; border-right:1px solid var(--border); padding:14px; overflow-y:auto; background:var(--panel)}
  .grp{margin-bottom:18px}
  .grp h3{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin-bottom:8px}
  .chip{display:inline-block; padding:5px 10px; margin:0 6px 6px 0; border-radius:14px; border:1px solid var(--border); background:var(--panel2); color:var(--dim); cursor:pointer; font-size:12.5px; user-select:none}
  .chip.on{border-color:var(--accent); color:var(--accent); background:rgba(90,176,255,.08)}
  .chip .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px}
  .preset{display:block; width:100%; text-align:left; padding:7px 10px; margin-bottom:6px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); cursor:pointer; font-size:12.5px}
  .preset:hover{border-color:var(--accent)}
  label.tog{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--dim); cursor:pointer; margin-bottom:6px}
  label.tog input{accent-color:var(--accent)}
  /* Middle: list */
  #list{width:390px; min-width:300px; border-right:1px solid var(--border); overflow-y:auto}
  .day{padding:8px 14px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); background:var(--panel); position:sticky; top:0; border-bottom:1px solid var(--border)}
  .item{padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer}
  .item:hover{background:var(--panel2)}
  .item.sel{background:rgba(90,176,255,.10); box-shadow:inset 3px 0 0 var(--accent)}
  .item .sha{font-family:ui-monospace,Consolas,monospace; font-size:11px; color:var(--accent)}
  .item .msg{font-size:13px; margin:3px 0}
  .item .meta{font-size:11px; color:var(--dim); font-family:ui-monospace,Consolas,monospace}
  .item .tag{display:inline-block; font-size:10px; padding:1px 7px; border-radius:10px; margin-left:6px; vertical-align:1px; color:#111318; font-weight:600}
  /* Right: detail */
  #detail{flex:1; overflow-y:auto; padding:20px 24px}
  #detail h2{font-size:16px; margin-bottom:4px}
  #detail .dmeta{color:var(--dim); font-size:12px; font-family:ui-monospace,Consolas,monospace; margin-bottom:14px}
  #detail p.why{color:var(--text); line-height:1.55; margin-bottom:14px; max-width:70ch}
  #detail ul{margin:0 0 14px 18px; line-height:1.65; max-width:70ch}
  #detail li{margin-bottom:4px}
  #detail code{font-family:ui-monospace,Consolas,monospace; font-size:12px; background:var(--panel2); padding:1px 5px; border-radius:4px}
  .files{font-family:ui-monospace,Consolas,monospace; font-size:11.5px; color:var(--dim); line-height:1.7}
  .flag{border-left:3px solid var(--amber); background:rgba(232,185,90,.07); padding:8px 12px; border-radius:0 6px 6px 0; margin-bottom:12px; font-size:12.5px; max-width:70ch}
  .placeholder{color:var(--dim); padding:40px; text-align:center}
  /* Bottom: prompt */
  #promptbar{border-top:1px solid var(--border); padding:12px 20px; background:var(--panel); display:flex; gap:12px; align-items:flex-start}
  #prompt{flex:1; font-size:13px; line-height:1.5; color:var(--text); font-family:ui-monospace,Consolas,monospace; max-height:96px; overflow-y:auto; white-space:pre-wrap}
  #copy{padding:8px 16px; border-radius:8px; border:1px solid var(--accent); background:rgba(90,176,255,.12); color:var(--accent); cursor:pointer; font-size:13px; white-space:nowrap}
  #copy.ok{border-color:var(--green); color:var(--green)}
  ::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:#333a46; border-radius:5px}
</style>
</head>
<body>
<header>
  <h1>DeCluttered — 3-Day Change Explorer</h1>
  <span class="sub">388b6df → bf45c88 · Sep 10–12, 2026 · 114 files · +9,677 / −1,984</span>
  <span class="stat" id="stat"></span>
</header>
<div id="main">
  <div id="controls">
    <div class="grp"><h3>Domain filters</h3><div id="domains"></div></div>
    <div class="grp"><h3>Presets</h3>
      <button class="preset" data-preset="all">Everything (chronological)</button>
      <button class="preset" data-preset="audio">Audio &amp; voice pipeline</button>
      <button class="preset" data-preset="seq">Sequencer &amp; parameters</button>
      <button class="preset" data-preset="ux">Voice Edit mode &amp; UI</button>
      <button class="preset" data-preset="flags">Flagged / noteworthy only</button>
    </div>
    <div class="grp"><h3>View options</h3>
      <label class="tog"><input type="checkbox" id="onlyFlagged"> Only flagged items</label>
      <label class="tog"><input type="checkbox" id="groupDay" checked> Group by day</label>
    </div>
  </div>
  <div id="list"></div>
  <div id="detail"><div class="placeholder">Select a commit to see what changed and why.</div></div>
</div>
<div id="promptbar">
  <div id="prompt"></div>
  <button id="copy">Copy</button>
</div>

<script>
const C = {
  audio:{name:"Audio & Voice", color:"var(--green)"},
  seq:{name:"Sequencer & Params", color:"var(--amber)"},
  ux:{name:"Voice Edit & UI", color:"var(--purple)"},
  docs:{name:"Docs & Cleanup", color:"var(--cyan)"},
  infra:{name:"Sensors & Infra", color:"var(--red)"}
};
const DATA = [
{sha:"388b6df", date:"Sep 10", dom:["infra","audio"], msg:"Fix audio dropouts; add MPR121 touch interrupt pin",
 why:"Audio only glitched when all four voices played simultaneously. The touch matrix was also poll-blind: Matrix_scan() throttled I2C reads to a 4 ms interval regardless of activity.",
 items:["Matrix_scan() now driven by the MPR121's active-low INT line on GP8 (INPUT_PULLUP + FALLING attachInterrupt). The ISR only sets a volatile flag; I2C reads and callback dispatch stay in the control loop.",
 "AudioEngine gained an output resampling/level fix path (+45 lines) and audio_i2s.c gained DMA buffer hardening (+19 lines) to survive the 4-voice load.",
 "docs/audio-performance.md added (70 lines) documenting the fix.",
 "playground.html and synth_layout.html moved into docs/."],
 files:"src/matrix/Matrix.cpp(+45) · src/app/AudioEngine.cpp(+45) · src/audio/audio_i2s.c · docs/audio-performance.md (new)"},

{sha:"7b3e12a", date:"Sep 10", dom:["audio"], msg:"AudioWorks; remove RAM test; waveguide coefficient cache",
 why:"Confirmed the audio path working on hardware (saved a reference UF2) and removed the temporary RAM test. Waveguide string voices recalculated filter/coefficient state on every control update even when nothing changed.",
 items:["Voice.h adds a WaveguideSettings cache (t60, brightness, pick position/hardness, stiffness, detune + valid flag); coefficients are only recomputed when a control actually changes or the string model is reset.",
 "audio_i2s.c gained ~55 lines of DMA/IRQ efficiency work.",
 "New test_voice_recipes.cpp (69 lines) locks in voice recipe behavior.",
 "WorkingUF2/Pico2SeqWorks9_10_26.uf2 committed as the known-good binary."],
 files:"src/voice/Voice.h/.cpp · src/audio/audio_i2s.c · tests/unit/test_voice_recipes.cpp (new)"},

{sha:"a97c0e5", date:"Sep 11", dom:["seq"], msg:"Fix Note parameter capped at 1 octave",
 why:"The Note track's range constant (0–21 scale steps) silently capped melodic sequences to about one octave, and the Octave parameter was ambiguously specified.",
 items:["SequencerConstants adds NOTE_PARAMETER_MIN=0 / NOTE_PARAMETER_MAX=36 — a three-octave chromatic C-to-C span.",
 "CORE_PARAMETERS[Note] changes from float 0–21 to an integral 0–36 definition; Octave redefined as a normalized control mapped to −12/0/+12 semitones.",
 "EncoderManager + ControlSurfaceLogic updated so encoder editing honors the new integral range.",
 "New tests in test_sequencer.cpp (32 lines), test_control_surface_logic.cpp, test_voice.cpp."],
 files:"SequencerDefs.h · EncoderManager.cpp · ControlSurfaceLogic.cpp/h · test_sequencer.cpp", flag:"Note values written by older sketches/docs (0–21 float) no longer match the new integral 0–36 range — check any saved patterns."},

{sha:"8961d07", date:"Sep 11", dom:["audio","seq","ux"], msg:"Remove global delay effect entirely",
 why:"The global delay effect was cut — a deliberate feature deletion (~364 lines out) to simplify the audio chain and UI.",
 items:["AudioEngine drops the delay send/return path (−77 lines); EncoderManager loses its delay-mode encoder handling (−98 lines).",
 "FeatureConfig.h delay feature flags removed; OLED, ButtonHandlers, UIEventHandler, AlchemyControlBridge all lose delay references.",
 "docs/manual.md, sensors.md, ButtonHandlers.md, firmware-structure.md rewritten to match.",
 "scripts/build.ps1 added (65 lines) as a build helper."],
 files:"26 files, +132/−364 · AudioEngine.cpp · EncoderManager.cpp · FeatureConfig.h", flag:"Any user workflow or documentation that referenced the delay knob is now invalid."},

{sha:"06b40e9", date:"Sep 11", dom:["ux"], msg:"Add master volume control",
 why:"Expose a global master volume on the control surface.",
 items:["AlchemyControlBridge + ControlSurfaceLogic map a new master-volume control through the UI bridge.",
 "docs/interactive_explainer.html added (1,709 lines) — a new self-contained interactive manual page."],
 files:"AlchemyControlBridge.cpp/h · ControlSurfaceLogic.cpp/h · docs/interactive_explainer.html (new)"},

{sha:"9c60536", date:"Sep 11", dom:["ux"], msg:"PR #23: new Voice Editing mode",
 why:"The headline feature of the window: a dedicated per-voice editing mode with its own parameter model, encoder mapping, and UI state, replacing a large tangle of encoder-mode logic.",
 items:["New src/voice/VoiceEditParameters.cpp/.h (988 + 136 lines): a declarative per-engine parameter model for editing any voice's synthesis controls.",
 "New src/app/VoiceEditor.cpp/.h and src/ui/VoiceEditControls.h (88 lines) wire the mode into the app; EncoderManager.cpp shrinks by ~248 lines of mode-specific branching.",
 "VoiceConfig.h extended; Sequencer gains voice-edit hooks (Sequencer.h +34).",
 "New test_voice_edit.cpp (221 lines) and test_audio_i2s.cpp (86 lines); tests/audio_stubs/ hardware stub tree added so audio code is unit-testable."],
 files:"VoiceEditParameters.cpp/.h (new) · VoiceEditor.cpp/.h (new) · VoiceEditControls.h (new) · EncoderManager.cpp", flag:"This is the largest single change (~1,975 insertions). Parameter semantics live in VoiceEditParameters — the single source of truth for what each knob does per engine."},

{sha:"f1a5330", date:"Sep 11", dom:["docs"], msg:"Doc overhaul; remove obsolete interactive pages; rename HTML docs",
 why:"Bring all documentation current after the delay removal and voice-edit additions, and consolidate the interactive HTML pages.",
 items:["playground.html → docs/PICO2SEQplayground.html; interactive_explainer → pico2seqinteractive_explainer.html.",
 "docs/voice_edit_playground.html added (1,364 lines) — the interactive manual for Voice Edit mode.",
 "manual.md (+150 lines), oled.md (+55), sensors.md (+54) substantially refreshed; midi.md/MidiCCConfig updated for removed delay CCs.",
 "DistanceSensor range constant touched (sensor docs alignment).",
 "tests/verify_docs_links.py updated for the renames."],
 files:"24 files, +1,699/−272 · docs/* · src/midi/*"},

{sha:"0fe0d53", date:"Sep 11", dom:["infra"], msg:"Save newest working binary",
 why:"Bench checkpoint: commit the flashed-good UF2 after the day's tuning.",
 items:["WorkingUF2 binary only — no source changes."],
 files:"WorkingUF2/*.uf2"},

{sha:"51ced80", date:"Sep 11", dom:["seq"], msg:"Tune sequencer defaults and randomizer sweet spots",
 why:"Bench-tuned the randomizeParameters() distributions: the old ranges produced sequences that felt lopsided (too sparse/too dense, filters inaudible).",
 items:["Gate on-probability 1/13 → 1/16; even-step velocity 75%→50% ones; odd-step 33%→25%.",
 "Velocity range 0.25–0.8 → 0.25–0.7; Attack 0.01–0.5 → 0.05–0.5; Decay 0.1–0.5 → 0.1–0.2.",
 "Filter randomization 0.2–0.95 → 0.1–0.6 (fixing the upper dead zone against the new default cutoff).",
 "Default filter cutoff raised for audibility (paired fix in e1bae0e)."],
 files:"ParameterManager.cpp · SequencerDefs.h · scales.cpp"},

{sha:"d628136 + 215bf22", date:"Sep 12", dom:["ux","docs"], msg:"PR #25/#26: Voice Editor refinements + big code simplification",
 why:"PR #25 (Ica/simplify-code-maintainability) plus a follow-up refined the Voice Editor wiring and deleted ~289 lines of duplicated OLED/encoder logic.",
 items:["OLED formatting centralized; oled.cpp/oled.h lose one-off drawing helpers.",
 "EncoderManager.cpp −174 lines: mode logic moved to the VoiceEditor/ControlSurface layer.",
 "Default filter cutoff raised for audibility (e1bae0e, +86 test lines in test_sequencer.cpp)."],
 files:"oled.cpp/h · EncoderManager.cpp/h · VoiceEditor.cpp · test_sequencer.cpp"},

{sha:"1ee8d74", date:"Sep 12", dom:["audio","seq"], msg:"Fix gate timing; smooth voice output levels (PR #28 base)",
 why:"Two audible artifacts fixed: gate-length changes had no effect (note-off arrived at the next step boundary instead of mid-step), and master volume / transport mute stepped the output abruptly (clicks).",
 items:["ClockService now ticks note duration for ALL voices (2–3 are audio-only but still track gate length); an expired gate pushes the note-off to the audio voice immediately via VoiceManager::updateVoiceState.",
 "VoiceManager adds a one-pole master-gain smoother (τ = 15 ms, alpha derived from sample rate) applied per-sample; volume knob moves and transport mute/unmute are now click-free.",
 "New test_voice_transfer.cpp (69 lines) verifies state transfer to audio voices.",
 "docs/plans/2026-09-12-pattern-patch-persistence.md added (2,061 lines) — the persistence design plan."],
 files:"ClockService.cpp · VoiceManager.cpp/h · test_voice_transfer.cpp (new) · persistence plan doc (new)"},

{sha:"38b8c55 + 0ce4528", date:"Sep 12", dom:["ux","docs"], msg:"PR #28 merged: OLED playback values + MusicalValues extraction",
 why:"Polish for the Voice Edit / playback UI and a maintainability extraction of musical math.",
 items:["New src/voice/MusicalValues.h (114 lines): shared musical value tables/formulas used by both edit UI and voice code.",
 "EncoderManager.h −62 lines; OLED playback screen shows live parameter values.",
 "test_voice_edit.cpp +155 lines; Voice.cpp refactored onto MusicalValues."],
 files:"MusicalValues.h (new) · EncoderManager.h · oled.cpp · test_voice_edit.cpp", flag:"Known review nit: dangling FLASH_SPEED_ZONES extern left in EncoderManager.h; Noise/Silent fallback nit in MusicalValues.h:53."},

{sha:"bf45c88", date:"Sep 12", dom:["infra"], msg:"Merge DeCluttered origin — branch divergence resolved",
 why:"The ahead-1/behind-6 split between local and origin DeCluttered was merged; the full suite passed 268/268 afterwards.",
 items:["Merge commit only; tip of the analyzed window."],
 files:"—"}
];

const DEFAULTS = {doms:new Set(Object.keys(C)), onlyFlagged:false, groupDay:true, sel:0};
let state = {doms:new Set(Object.keys(C)), onlyFlagged:false, groupDay:true, sel:null};

function visible(){
  return DATA.map((d,i)=>({d,i})).filter(({d}) =>
    d.dom.some(k=>state.doms.has(k)) &&
    (!state.onlyFlagged || d.flag));
}
function renderDomains(){
  const el = document.getElementById('domains'); el.innerHTML='';
  for(const [k,v] of Object.entries(C)){
    const s = document.createElement('span');
    s.className = 'chip' + (state.doms.has(k)?' on':'');
    s.innerHTML = `<span class="dot" style="background:${v.color}"></span>${v.name}`;
    s.onclick = ()=>{ state.doms.has(k)?state.doms.delete(k):state.doms.add(k); renderAll(); };
    el.appendChild(s);
  }
}
function renderList(){
  const el = document.getElementById('list'); el.innerHTML='';
  const vis = visible();
  document.getElementById('stat').textContent = `${vis.length}/${DATA.length} commits shown`;
  let lastDay = null;
  for(const {d,i} of vis){
    if(state.groupDay && d.date!==lastDay){
      lastDay = d.date;
      const h = document.createElement('div'); h.className='day'; h.textContent=d.date; el.appendChild(h);
    }
    const it = document.createElement('div');
    it.className = 'item' + (i===state.sel?' sel':'');
    const tags = d.dom.map(k=>`<span class="tag" style="background:${C[k].color}">${C[k].name}</span>`).join('');
    it.innerHTML = `<div><span class="sha">${d.sha}</span>${d.flag?' <span style="color:var(--amber)">⚠</span>':''}</div>
      <div class="msg">${d.msg}</div><div class="meta">${d.files.split('·').length>0?'':''}${tags}</div>`;
    it.onclick = ()=>{ state.sel=i; renderList(); renderDetail(); updatePrompt(); };
    el.appendChild(it);
  }
}
function renderDetail(){
  const el = document.getElementById('detail');
  if(state.sel===null || !DATA[state.sel]){ el.innerHTML='<div class="placeholder">Select a commit to see what changed and why.</div>'; return; }
  const d = DATA[state.sel];
  el.innerHTML = `
    <h2>${d.msg}</h2>
    <div class="dmeta">${d.sha} · ${d.date} · ${d.dom.map(k=>C[k].name).join(', ')}</div>
    ${d.flag?`<div class="flag">⚠ ${d.flag}</div>`:''}
    <p class="why">${d.why}</p>
    <ul>${d.items.map(x=>`<li>${x}</li>`).join('')}</ul>
    <div class="files">Files: ${d.files}</div>`;
}
function updatePrompt(){
  const vis = visible();
  let p;
  if(!state.onlyFlagged && state.doms.size===Object.keys(C).length){
    p = `Write a detailed summary of all changes to the DeCluttered branch of Pico2Seq over Sep 10–12, 2026 (388b6df..bf45c88, 18 commits, 114 files, +9,677/−1,984). Cover: (1) audio fixes — MPR121 interrupt-driven touch scanning on GP8, waveguide coefficient caching, DMA hardening; (2) the removal of the global delay effect (~364 lines out); (3) the new master volume control with a 15 ms one-pole gain smoother to kill clicks; (4) gate-timing fix so note-offs fire mid-step for all 4 voices; (5) the Note parameter range fix from 0–21 scale steps to a 3-octave 0–36 chromatic span; (6) the new Voice Editing mode (VoiceEditParameters, VoiceEditor, VoiceEditControls — the largest change at ~2k insertions); (7) randomizer sweet-spot retuning (gate 1/16, filter 0.1–0.6, velocity 0.25–0.7); (8) the doc overhaul incl. renamed HTML playgrounds and voice_edit_playground.html; (9) new tests (test_voice_edit, test_voice_transfer, test_voice_recipes, test_audio_i2s + audio_stubs). Note flagged caveats: integral Note range breaks old float patterns, and known review nits (dangling FLASH_SPEED_ZONES extern in EncoderManager.h; MusicalValues.h:53 fallback).`;
  } else {
    const names = [...state.doms].map(k=>C[k].name).join(', ');
    const shas = vis.map(({d})=>d.sha).join(', ');
    p = `Summarize the following commits on the DeCluttered branch of Pico2Seq (${vis.length} commit${vis.length===1?'':'s'}${names?`, filtered to ${names}`:''}): ${shas}. For each, explain what changed, why, key files, and any flagged caveats.`;
  }
  document.getElementById('prompt').textContent = p;
}
function renderAll(){ renderDomains(); renderList(); renderDetail(); updatePrompt(); }
document.getElementById('onlyFlagged').onchange = e=>{ state.onlyFlagged=e.target.checked; renderAll(); };
document.getElementById('groupDay').onchange = e=>{ state.groupDay=e.target.checked; renderList(); };
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{
  const p = b.dataset.preset;
  state.onlyFlagged=false; document.getElementById('onlyFlagged').checked=false;
  if(p==='all'){ state.doms = new Set(Object.keys(C)); }
  else if(p==='audio'){ state.doms = new Set(['audio','infra']); }
  else if(p==='seq'){ state.doms = new Set(['seq']); }
  else if(p==='ux'){ state.doms = new Set(['ux']); }
  else if(p==='flags'){ state.doms = new Set(Object.keys(C)); state.onlyFlagged=true; document.getElementById('onlyFlagged').checked=true; }
  renderAll();
});
document.getElementById('copy').onclick = ()=>{
  navigator.clipboard.writeText(document.getElementById('prompt').textContent).then(()=>{
    const b=document.getElementById('copy'); b.textContent='Copied!'; b.classList.add('ok');
    setTimeout(()=>{b.textContent='Copy'; b.classList.remove('ok');},1200);
  });
};
renderAll();
</script>
</body>
</html>
