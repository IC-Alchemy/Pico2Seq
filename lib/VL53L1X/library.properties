name=VL53L1X
version=1.0.0
author=IC-Alchemy
sentence=Non-blocking Arduino driver for the ST VL53L1X time-of-flight distance sensor, tuned for real-time parameter control.
paragraph=Reads the VL53L1X over I2C via the Melopero driver and provides continuous-mode distance in millimeters with a non-blocking update() that rate-limits reads and caps them with a hard timeout, so a stalled sensor never blocks the loop. Includes short/medium/long distance presets and fully configurable timing budget, inter-measurement period, and polling cadence.
