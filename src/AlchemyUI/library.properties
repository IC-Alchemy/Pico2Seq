sentence=Hub-side client for Alchemy Modular UI tiles: faders and buttons over I2C register protocol v2.
paragraph=Scans one or two Qwiic banks for the platform registry addresses (slider 4x + button 4x at 0x08-0x0A, button 4x at 0x0B-0x0D), verifies the v2 identity block, and polls tiles with the spec's adaptive read: one STATUS byte while the 4-bit SEQ counter is static, the whole checksum-verified STATUS+DATA+SUM frame the moment it advances. Sticky press/release bits become per-button press/hold/tap edges, faders arrive as raw 12-bit counts or normalized 0..1, and tiles are paced round-robin so a 1 kHz control loop never stalls servicing five of them. The protocol layer (AlchemyProto.h) and the button edge layer (TileButton.h) are pure C++ and host-testable; only AlchemyTiles touches Wire. AlchemyPanel composes the tiles into a 20-button logical surface via one editable mapping table (ButtonMap.h).
category=Signal Input/Output
