sentence=Hub-side client for Alchemy Modular UI tiles: faders and buttons over I2C register protocol v2.
paragraph=Scans one or two Qwiic banks for the platform registry addresses (slider 4x + button 4x at 0x08-0x0A, button 4x at 0x0B-0x0D), verifies the v2 identity block, and polls each tile by reading its whole checksum-verified STATUS+DATA+SUM snapshot in one transaction, decoded into a compact 11-byte state packet (sequence counter, button bits, four 12-bit sliders, status). A per-tile SatelliteLink decides how much of a cached packet to believe: a sequence counter so an unchanged snapshot never re-publishes, a timeout after which buttons release but fader positions hold, and last-known-good state so a NACK, short read or bad checksum is dropped whole rather than propagating garbage. Sticky press/release bits become per-button press/hold/tap edges, faders arrive as raw 12-bit counts or normalized 0..1, and tiles are paced round-robin so a 1 kHz control loop never stalls servicing five of them. The protocol layer (AlchemyProto.h), the link-state layer (SatelliteLink.h) and the button edge layer (TileButton.h) are pure C++ and host-testable; only AlchemyTiles touches Wire. AlchemyPanel composes the tiles into a 20-button logical surface via one editable mapping table (ButtonMap.h).
category=Signal Input/Output
